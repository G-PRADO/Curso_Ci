name: Entrega continua

on:
  workflow_call:

jobs:

  EC2:
      runs-on: ubuntu-latest
      steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.ID_CHAVE_ACESSA }}
          aws-secret-access-key: ${{ secrets.CHAVE_SECRETA}}
          aws-region: us-east-1
      
      - name: obtendo arquivo da tarefa
        run: aws ecs describe-task-definition --task-definition Tarefa_API-GO --query taskDefinition > task-definition.json

      - name: Verificar container
        run: |
          cat task-definition.json
          echo "---- Nomes dos containers ----"
          jq -r '.containerDefinitions[].name' task-definition.json  

      - name: Fill in the new image ID in the Amazon ECS task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: api-go
          image: gprado10/go_ci:Projeto_base
          environment-variables: |
            HOST=${{ secrets.DBHOST }}
            USER=${{ secrets.DBUSER }}
            PASSWORD=${{ secrets.DBPASSWORD }}
            DBNAME=${{ secrets.DBNAME }}
            DBPORT=${{ secrets.DBPORT }}
            PORT=8000

      - name: Deploy Amazon ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: Servico_API-GO
          cluster: CLUSTERS-API-GO
          wait-for-service-stability: true
